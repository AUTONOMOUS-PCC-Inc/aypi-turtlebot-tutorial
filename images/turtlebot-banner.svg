<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Vibe-coding camp session 2 — drive a ROS 2 TurtleBot3 in WSL from MATLAB on Windows: lidar in, velocity out, scripts then Simulink">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="60%" stop-color="#0E2342"/>
      <stop offset="100%" stop-color="#132C52"/>
    </linearGradient>
    <linearGradient id="taccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E6FD9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1E6FD9" stop-opacity="0"/>
    </radialGradient>
    <marker id="tbarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7FB2FF"/>
    </marker>
    <style>
      .t  { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 40px; font-weight: 700; fill: #F2F7FF; letter-spacing: -0.5px; }
      .h2 { font-size: 17px; font-weight: 600; fill: #7FB2FF; letter-spacing: 3.2px; }
      .sub{ font-size: 15px; fill: #8FA3BF; }
      .tag{ font-size: 12.5px; font-weight: 600; fill: #BFD3EE; }
      .mono{ font-family: "JetBrains Mono", "Consolas", "SF Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="250" rx="10" fill="url(#tbg)"/>
  <circle cx="975" cy="125" r="185" fill="url(#tglow)"/>

  <!-- 좌측: 라이다 360개 빔 — 앞이 막히면 더 빈 쪽으로 돈다 -->
  <g transform="translate(96,125)" opacity="0.95">
    <circle r="58" fill="none" stroke="#1E6FD9" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="46" fill="none" stroke="#2B4F85" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- 빔: 막힌 쪽은 짧게 돌아온다 -->
    <g stroke="#7FB2FF" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round">
      <path d="M0,0 L21.2,-21.2"/><path d="M0,0 L26,-15"/><path d="M0,0 L29,-7.8"/>
      <path d="M0,0 L30,0"/>
      <path d="M0,0 L29,7.8"/><path d="M0,0 L26,15"/><path d="M0,0 L21.2,21.2"/>
      <path d="M0,0 L23,39.8"/><path d="M0,0 L11.9,44.4"/><path d="M0,0 L0,46"/>
      <path d="M0,0 L-11.9,44.4"/><path d="M0,0 L-23,39.8"/><path d="M0,0 L-32.5,32.5"/>
      <path d="M0,0 L-39.8,23"/><path d="M0,0 L-44.4,11.9"/><path d="M0,0 L-46,0"/>
      <path d="M0,0 L-44.4,-11.9"/><path d="M0,0 L-39.8,-23"/><path d="M0,0 L-32.5,-32.5"/>
      <path d="M0,0 L-23,-39.8"/><path d="M0,0 L-11.9,-44.4"/><path d="M0,0 L0,-46"/>
      <path d="M0,0 L11.9,-44.4"/><path d="M0,0 L23,-39.8"/>
    </g>

    <!-- 앞을 막고 선 벽 -->
    <path d="M 19.3 -23 A 30 30 0 0 1 19.3 23" fill="none" stroke="#EF4444" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>

    <!-- 로봇: 더 빈 왼쪽으로 돈다 -->
    <circle r="15" fill="#0B1B33" stroke="#2B4F85"/>
    <circle r="4.5" fill="#6EE7A0" fill-opacity="0.85"/>
    <path d="M -22 -14 A 26 26 0 0 0 -22 14" fill="none" stroke="#6EE7A0" stroke-opacity="0.8" stroke-width="2" marker-end="url(#tbarrow)"/>
    <text class="t mono" x="0" y="57" font-size="10" fill="#6EE7A0" text-anchor="middle">360 ranges in, v and w out</text>
  </g>

  <!-- 본문 -->
  <text class="t h2" x="196" y="74">VIBE-CODING CAMP · SESSION 2</text>
  <text class="t h1" x="196" y="124">drive TurtleBot3 from MATLAB</text>
  <text class="t sub" x="196" y="154">Windows MATLAB speaks ROS 2 to a robot in WSL2 — in scripts first, then the same controller in Simulink.</text>

  <!-- 태그 -->
  <g transform="translate(196,176)">
    <g>
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="42" y="17.5" text-anchor="middle">one day</text>
    </g>
    <g transform="translate(94,0)">
      <rect x="0" y="0" width="140" height="26" rx="13" fill="#1E6FD9" fill-opacity="0.16" stroke="#1E6FD9" stroke-opacity="0.45"/>
      <text class="t tag mono" x="70" y="17.5" text-anchor="middle">MATLAB + Simulink</text>
    </g>
    <g transform="translate(244,0)">
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#16A34A" fill-opacity="0.16" stroke="#16A34A" stroke-opacity="0.45"/>
      <text class="t tag mono" x="56" y="17.5" text-anchor="middle">WSL2 · ROS 2</text>
    </g>
    <g transform="translate(366,0)">
      <rect x="0" y="0" width="104" height="26" rx="13" fill="#EAB308" fill-opacity="0.16" stroke="#EAB308" stroke-opacity="0.45"/>
      <text class="t tag mono" x="52" y="17.5" text-anchor="middle">4 exercises</text>
    </g>
  </g>

  <!-- 우측: 토픽은 건너가지만 목록은 건너가지 않는다 -->
  <g transform="translate(878,44)" opacity="0.96">
    <rect width="212" height="158" rx="8" fill="#0B1B33" stroke="#2B4F85"/>
    <path d="M0 24 h212" stroke="#2B4F85" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#3E6FA8"/><circle cx="26" cy="12" r="3" fill="#3E6FA8"/><circle cx="38" cy="12" r="3" fill="#3E6FA8"/>
    <text class="t mono" x="56" y="16" font-size="9.5" fill="#6F87A6">domain 30 · Fast DDS</text>

    <g transform="translate(36,34)">
      <rect width="140" height="30" rx="5" fill="#12294A" stroke="#2B4F85"/>
      <text class="t mono" x="70" y="13" font-size="9" fill="#BFD3EE" text-anchor="middle">MATLAB R2025b</text>
      <text class="t mono" x="70" y="24" font-size="8" fill="#6F87A6" text-anchor="middle">Windows · Jazzy</text>
    </g>

    <g fill="none" stroke="#7FB2FF" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#tbarrow)">
      <path d="M 76 64 V 108"/>
      <path d="M 136 110 V 66"/>
    </g>
    <g class="t mono" font-size="8">
      <text x="70" y="89" fill="#7FB2FF" text-anchor="end">/cmd_vel</text>
      <text x="142" y="83" fill="#6EE7A0">/scan</text>
      <text x="142" y="95" fill="#6EE7A0">/odom</text>
    </g>

    <g transform="translate(36,110)">
      <rect width="140" height="30" rx="5" fill="#12294A" stroke="#2B4F85"/>
      <text class="t mono" x="70" y="13" font-size="9" fill="#BFD3EE" text-anchor="middle">ROS 2 + Gazebo</text>
      <text class="t mono" x="70" y="24" font-size="8" fill="#6F87A6" text-anchor="middle">WSL2 · Humble</text>
    </g>

    <text class="t mono" x="106" y="152" font-size="8.5" fill="#6F87A6" text-anchor="middle">messages cross · topic lists do not</text>
  </g>

  <rect x="0" y="244" width="1200" height="6" rx="3" fill="url(#taccent)" opacity="0.85"/>
</svg>
